baseURL = 'https://lycat475-github-io.pages.dev/'
title = 'lycat-build with 475'
defaultContentLanguage = 'zh'
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.zh]
    locale = 'zh-CN'
    label = '中文'

[pagination]
  pagerSize = 20

[params]
  name = 'lycat475 的 blog'
  h1 = 'LYCAT475'
  intro = 'A new CTFer && a photography beginner'
  author = 'lycat475'
  signNote = 'by lycat475'

  # 上线开关：true 时全站只显示「准备中」页面
  holding = false
  holdingTitle = '还没准备好喵'
  holdingNote = '摸鱼好爽喵~ 噫噫噫补药电窝了本喵马上就干活喵'

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  style = 'solarized-light'
  noClasses = true
  lineNos = false

[[menus.main]]
  name = '归档'
  pageRef = '/posts'
  weight = 10
[[menus.main]]
  name = '相册'
  pageRef = '/gallery'
  weight = 20
[[menus.main]]
  name = '关于'
  pageRef = '/about'
  weight = 30
