{{ define "main" }}
<article class="post">
  <header class="post-head">
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <p class="meta">
      {{ .Date.Format "2006.01.02" }}{{ with .Params.tags }} · {{ delimit . " / " }}{{ end }}
    </p>
    {{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  {{ if eq .Section "posts" }}{{ partial "sign.html" . }}{{ end }}
</article>
{{ end }}
