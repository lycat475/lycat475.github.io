{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="lede">{{ . }}</div>{{ end }}
</header>

{{ $imgs := .Resources.ByType "image" }}
{{ if $imgs }}
<div class="plates gallery">
  {{ range $i, $img := $imgs }}
    {{ partial "figure.html" (dict "res" $img "n" $i) }}
  {{ end }}
</div>
{{ else }}
<div class="slot-empty">
  <div class="slot slot-lg" aria-hidden="true">ly</div>
  <p class="muted meow">空空如也喵</p>
</div>
{{ end }}
{{ end }}
