{{ $r := .res }}
{{ $n := .n }}
{{ $small := $r.Resize "560x webp q80" }}
{{ $large := $r.Resize "1200x webp q80" }}
<figure class="plate">
  <img
    src="{{ $large.RelPermalink }}"
    srcset="{{ $small.RelPermalink }} 560w, {{ $large.RelPermalink }} 1200w"
    sizes="(max-width: 720px) 46vw, 360px"
    alt=""
    width="{{ $large.Width }}" height="{{ $large.Height }}"
    loading="lazy" decoding="async">
  <figcaption>
    <span class="plate-no">{{ printf "%02d" (add $n 1) }}</span>
  </figcaption>
</figure>
