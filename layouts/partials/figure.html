{{ $r := .res }}
{{ $n := .n }}
{{ $sizes := default "(max-width: 720px) 46vw, 360px" .sizes }}
{{ $w := default 1200 .width }}
{{ $small := $r.Resize (printf "%dx webp q80" (div $w 2)) }}
{{ $large := $r.Resize (printf "%dx webp q80" $w) }}
<figure class="plate">
  <img
    src="{{ $large.RelPermalink }}"
    srcset="{{ $small.RelPermalink }} {{ div $w 2 }}w, {{ $large.RelPermalink }} {{ $w }}w"
    sizes="{{ $sizes }}"
    alt=""
    width="{{ $large.Width }}" height="{{ $large.Height }}"
    loading="lazy" decoding="async">
  <figcaption>
    <span class="plate-no">{{ printf "%02d" (add $n 1) }}</span>
  </figcaption>
</figure>
